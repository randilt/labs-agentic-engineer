openapi: 3.1.0
info:
  title: Orders API
  version: 0.1.0
paths:
  /orders:
    get:
      summary: List orders for a customer
      parameters:
        - in: query
          name: customerId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order list
    post:
      summary: Create an order
      responses:
        "201":
          description: Created
  /orders/{id}:
    get:
      summary: Get an order by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order
        "404":
          description: Not found
